<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lanika</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="game-shell">
    <header class="hud">
      <h1 class="hud__title">Lanika</h1>
      <p class="hud__stat">Счёт: <span id="score">0</span></p>
    </header>

    <canvas id="game" class="game-canvas" width="800" height="450"></canvas>

    <footer class="controls">
      <button id="start" type="button" class="button">Старт</button>
      <button id="pause" type="button" class="button">Пауза</button>
    </footer>
  </div>

  <script src="js/input.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
