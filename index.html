<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lanika</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="game-shell">
    <header class="hud">
      <h1 class="hud__title">Lanika</h1>
      <p class="hud__stat">Счёт: <span id="score">0</span></p>
    </header>

    <div class="field">
      <canvas id="game" class="field__canvas"></canvas>
    </div>

    <div class="pad">
      <div class="pad__group">
        <button type="button" class="key" data-action="left" aria-label="Влево">←</button>
        <button type="button" class="key" data-action="down" aria-label="Вниз">↓</button>
      </div>
      <div class="pad__group">
        <button type="button" class="key" data-action="right" aria-label="Вправо">→</button>
        <button type="button" class="key key--go" data-action="go" aria-label="Ход">GO</button>
      </div>
    </div>
  </div>

  <script src="js/input.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
